version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: intercom_postgres
    environment:
      POSTGRES_USER: intercom_user
      POSTGRES_PASSWORD: intercom_password
      POSTGRES_DB: intercom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercom_user -d intercom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: intercom_bot
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
