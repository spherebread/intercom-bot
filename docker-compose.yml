version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: intercom_postgres
    environment:
      POSTGRES_USER: intercom_user
      POSTGRES_PASSWORD: intercom_password
      POSTGRES_DB: intercom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercom_user -d intercom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: intercom_bot
    env_file:
      - .env
    environment:
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
    depends_on:
      - postgres
      - telegram-bot-api
    restart: unless-stopped

  # Локальный Bot API сервер — фейловер, если api.telegram.org не отвечает
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  postgres_data:
  telegram_bot_api_data:
